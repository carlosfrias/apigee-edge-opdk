- hosts: planet
  become: yes
  tasks:
  - name: Wait for port 22
    wait_for:
      port: 22
      timeout: 300
    tags:
    - root_signin

  - name: Copy local public keys too server
    authorized_key:
      user: root
      state: present
      key: "{{ lookup('file', '~/.ssh/id_rsa.pub') }}"
    tags:
    - root_signin

  - name: Enable root login over SSH
    lineinfile:
      state: present
      dest: /etc/ssh/sshd_config
      regexp: '(^#)(PermitRootLogin yes)'
      line: '\2'
      backrefs: yes
    notify:
    - Restart SSH service
    tags:
    - root_signin

  handlers:
  - name: Restart SSH service
    service:
      name: sshd
      state: restarted