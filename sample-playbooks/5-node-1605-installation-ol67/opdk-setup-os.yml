- hosts: rmp
  strategy: free
  vars_files:
  - opdk-setup-settings.yml
  roles:
  - opdk-setup-os-rmp

- hosts: qpid
  strategy: free
  vars_files:
  - opdk-setup-settings.yml
  roles:
  - opdk-setup-os-qpid

- hosts: pg
  strategy: free
  vars_files:
  - opdk-setup-settings.yml
