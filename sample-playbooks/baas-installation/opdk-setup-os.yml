---
- hosts: planet
  become: true
  strategy: free
  roles:
  - opdk-setup-aws
  tags:
  - apigee
  - os
  - aws

- hosts: planet
  become: true
  strategy: free
  roles:
  - opdk-setup-default-settings
  tasks:
  - name: Create symlink to data folder
    file:
      src: /u01/apigee
      dest: '{{ apigee_installation_home }}'
      owner: '{{ opdk_user_name }}'
      group: '{{ opdk_group_name }}'
      state: link


- hosts: planet
  become: true
  strategy: free
  roles:
  - opdk-setup-selinux-disable
  - opdk-shutdown-iptables
  - opdk-time-sync
  - opdk-setup-os-minimum
  - opdk-setup-os-common
  tags:
  - os
  - os-basic

- hosts: planet
  become: true
  strategy: free
  roles:
  - opdk-setup-apigee-user
  tags:
  - apigee
  - os

- hosts: cassandra
  become: true
  strategy: free
  roles:
  - opdk-setup-os-ds
  tags:
  - os
  - os-ds

