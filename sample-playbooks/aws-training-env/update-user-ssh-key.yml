---
- hosts: '{{ hosts }}'
  become: yes
  gather_facts: no

  vars:
    pubkey: '~/.ssh/id_rsa.pub'
    user: 'mpurwar'

  tasks:
  - name: Wait for port 22
    wait_for:
      port: 22
      timeout: 300

  - name: Retrieve Setup facts
    setup:

  - name: Copy local public keys too server
    authorized_key:
      user: '{{ user }}'
      state: present
      key: "{{ lookup('file', '{{ pubkey }}') }}"
