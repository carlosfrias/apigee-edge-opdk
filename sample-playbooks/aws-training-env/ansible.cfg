[defaults]
host_key_checking = false
hostfile = inventory
forks = 50
remote_user = mpurwar
private_key_file = ~/.ssh/id_rsa
roles_path = ../../
log_path = ./ansible.log
retry_files_enabled = False
executable = /bin/bash
gathering = smart
fact_caching = jsonfile
fact_caching_connection = .ansible_cache

# library = /etc/ansible/library/

# 2 hour timeout
fact_caching_timeout = 7200


[ssh_connection]
ssh_args = -o ControlMaster=auto -o ControlPersist=7200s -o KbdInteractiveAuthentication=no -o PreferredAuthentications=gssapi-with-mic,gssapi-keyex,hostbased,publickey -o PasswordAuthentication=no -o ConnectTimeout=60
control_path=%(directory)s/ansible-ssh-%%h-%%p-%%r

