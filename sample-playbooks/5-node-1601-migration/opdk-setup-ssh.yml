---
- hosts: pgmaster
  tasks:
  - name: Setup hostvars name
    set_fact:
      hostvarname: '{{ ansible_hostname }}'

  - name: Setup hostvars name if on Amazon
    set_fact:
      hostvarname: '{{ ansible_ec2_local_ipv4 }}'
    when: "{{ ansible_bios_version | search('amazon') and ansible_ec2_local_ipv4 is defined }}"

- hosts: pgmaster
  vars:
    target_host_name: "{{ hostvars[hostvarname]['groups']['pgstandby'][0] }}"
  roles:
  - opdk-setup-ssh


- hosts: pgstandby
  tasks:
  - name: Setup hostvars name
    set_fact:
      hostvarname: '{{ ansible_hostname }}'

  - name: Setup hostvars name if on Amazon
    set_fact:
      hostvarname: '{{ ansible_ec2_local_ipv4 }}'
    when: "{{ ansible_bios_version | search('amazon') and ansible_ec2_local_ipv4 is defined }}"

- hosts: pgstandby
  vars:
    target_host_name: "{{ hostvars[hostvarname]['groups']['pgmaster'][0] }}"
  roles:
  - opdk-setup-ssh
