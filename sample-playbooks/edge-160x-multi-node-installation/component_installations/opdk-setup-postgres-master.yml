---
- hosts: '{{ hosts }}'
  serial: 1
  roles:
  - opdk-setup-postgres
  - opdk-setup-postgres-master
  tags:
  - pg
  - pgmaster

- hosts: '{{ hosts }}'
  serial: 1
  roles:
  - opdk-setup-default-settings
  tasks:
  - name: Obtain server self report
    opdk_server_self:
      server_type: 'ps'
      username: '{{ opdk_user_email }}'
      password: '{{ opdk_user_pass }}'
    ignore_errors: yes
  tags:
  - pg
  - pgmaster
