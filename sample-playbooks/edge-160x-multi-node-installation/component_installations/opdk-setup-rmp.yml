---
- hosts: '{{ hosts }}'
  strategy: free
  roles:
#  - opdk-setup-rmp
  - { role: opdk-setup-component, profile: 'rmp' }
  tags:
  - rmp

- hosts: '{{ hosts }}'
  strategy: free
  roles:
  - opdk-setup-default-settings
  tasks:
  - name: Obtain server self report
    opdk_server_self:
      server_type: 'router'
      username: '{{ opdk_user_email }}'
      password: '{{ opdk_user_pass }}'

  - name: Obtain server self report
    opdk_server_self:
      server_type: 'mp'
      username: '{{ opdk_user_email }}'
      password: '{{ opdk_user_pass }}'
  tags:
  - rmp
