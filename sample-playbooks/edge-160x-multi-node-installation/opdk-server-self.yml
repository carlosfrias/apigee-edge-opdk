---
- hosts: rmp
  roles:
  - opdk-setup-default-settings

  tasks:
  - name: Obtain router server self report
    ignore_errors: yes
    opdk_server_self:
      server_type: 'router'
      username: '{{ opdk_user_email }}'
      password: '{{ opdk_user_pass }}'

  - name: Obtain message processor server self report
    ignore_errors: yes
    opdk_server_self:
      server_type: 'mp'
      username: '{{ opdk_user_email }}'
      password: '{{ opdk_user_pass }}'

- hosts: pg
  serial: 1
  roles:
  - opdk-setup-default-settings
