- include: facts.yml

- include: opdk-setup-os.yml

- include: opdk-setup-openjdk.yml
  vars:
    hosts: 'dc-2'

- include: opdk-setup-bootstrap-archive.yml
  vars:
    hosts: 'dc-2'
  when: existing_archive is defined and existing_archive

- include: opdk-setup-bootstrap-create-download.yml
