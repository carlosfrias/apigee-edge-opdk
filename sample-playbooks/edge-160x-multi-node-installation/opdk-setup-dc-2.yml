    hosts: 'dc-2-ds'

- include: opdk-setup-ds.yml
  vars:
    hosts: 'dc-1-ds'

- include: opdk-cassandra-client-update.yml
  vars:
     hosts: 'dc-1-ms'

- include: opdk-setup-ms.yml
  vars:
    hosts: 'dc-1-ms'

- include: opdk-cassandra-rebuild.yml
