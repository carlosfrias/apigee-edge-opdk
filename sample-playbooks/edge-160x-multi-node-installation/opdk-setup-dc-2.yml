    hosts: 'dc-2-ds'

- include: opdk-setup-ms.yml
  vars:
    hosts: 'dc-2-ms'
  tags:
  - ms2

- include: opdk-setup-rmp.yml
  vars:
    hosts: 'dc-2-rmp'

- include: opdk-setup-rmp.yml
  vars:
    hosts: 'dc-1-rmp'

- include: opdk-setup-qpid.yml
  vars:
    hosts: 'dc-2-qpid'

- include: opdk-setup-postgres-master.yml
  vars:
    hosts: 'dc-2-pgmaster'

- include: opdk-setup-postgres-standby.yml
  vars:
    hosts: 'dc-2-pgstandby'

- include: opdk-setup-startup.yml

- include: opdk-setup-validate.yml

