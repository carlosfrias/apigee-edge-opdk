---
- hosts: ds,pg,qpid
  vars:
    apigee_dirs:
    - /opt/apigee4/apigee4/var
    - /var/prod/data/apigee4/data
    - /var/prod/logs/apigee4/var/log
    apigee_links:
    - { dest: /opt/apigee, src: /opt/apigee4/apigee4 }
    - { dest: /opt/apigee/data, src: /var/prod/data/apigee4/data }
    - { dest: /opt/apigee/var/log, src: /var/prod/logs/apigee4/var/log }
  roles:
  - opdk-setup-default-settings

  tasks:

  - name: Create source folders
    file:
      owner: '{{ opdk_user_name }}'
      group: '{{ opdk_group_name }}'
      state: directory
      path:  '{{ item }}'
    with_items: '{{ apigee_dirs }}'
    tags:
    - source

  - name: Create symlinks
    file:
      owner: '{{ opdk_user_name }}'
      group: '{{ opdk_group_name }}'
      state: link
      dest: '{{ item.dest }}'
      src: '{{ item.src }}'
    with_items: '{{ apigee_links }}'
    tags:
    - links


