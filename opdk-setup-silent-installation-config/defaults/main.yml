---
# defaults file for opdk-setup-silent-file
opdk_major_version: '4'
opdk_minor_version: '15'
opdk_build_version: '07.03'
opdk_version: "{{ opdk_major_version }}.{{opdk_minor_version }}.{{ opdk_build_version }}"

opdk_user_name: apigee
opdk_user_email: opdk@apigee.com
opdk_user_pass: Apigee123!
opdk_group_name: "{{ opdk_user_name }}"
opdk_user_home: /home/{{ opdk_user_name }}
opdk_user_ssh_private_key: "{{ opdk_user_home }}/.ssh/id_rsa"

opdk_staging_folder_name: opdk
opdk_installer_path: "{{ opdk_user_home }}/{{ opdk_staging_folder_name }}"
opdk_installer_file_prefix: apigee-edge
opdk_installer_file_basename: '{{ opdk_installer_file_prefix}}-{{ opdk_version }}'
opdk_installer_file_suffix: 'zip'

opdk_staging_path_prefix: "{{ opdk_installer_path }}/{{ opdk_version }}"
opdk_installer_staging_folder_path: "{{ opdk_staging_path_prefix }}/{{ opdk_installer_file_basename }}"
opdk_installer_archive_name: "{{ opdk_installer_file_basename }}.{{ opdk_installer_file_suffix }}"
opdk_installer_archive_path: "{{ opdk_staging_path_prefix }}/{{ opdk_installer_archive_name }}"

opdk_response_file_path: "{{ opdk_installer_path }}/response.txt"
opdk_license_file_name: license.txt
opdk_license_file_path: "{{ opdk_installer_path }}/license.txt"

apigee_installation_path_prefix: /opt
apigee_data_path_prefix: '{{ apigee_installation_path_prefix }}'
apigee_installation_dir: apigee4
apigee_installation_home: "{{ apigee_installation_path_prefix }}/{{ apigee_installation_dir }}"

apigee_install_script: "{{ opdk_installer_staging_folder_path }}/apigee-install.sh"
apigee_install_command: "{{ apigee_install_script }} -r {{ apigee_installation_path_prefix }} -d {{ apigee_data_path_prefix }} -j {{ open_jdk_path }}"

apigee_tmp_dir: /tmp
open_jdk_path: /usr/lib/jvm/java-openjdk
opdk_ldap_type: '1'
opdk_ldap_remote_host: 'n'
opdk_ldap_sid: '1'
opdk_ldap_peer: ''
opdk_ldap_pass: '{{ opdk_user_pass }}'
opdk_enable_ax: 'y'
opdk_region: 'dc-1'
opdk_mp_pod: 'gateway'
opdk_ms_group: 'ms'
opdk_ds_group: 'ds'
opdk_use_zk_cluster: 'y'
opdk_use_cass_cluster: 'y'
opdk_cass_username: 'cassandra'
opdk_cass_password: '{{ opdk_cass_username }}'
opdk_skip_smpt: 'y'
opdk_smtp_host: 'smtp.example.com'
opdk_smtp_port: '25'
opdk_smtp_user: 'smtp@example.com'
opdk_smtp_password: 'smtppwd'
opdk_smtp_ssl: 'n'
opdk_bind_on_all_interfaces: 'y'

apigee_repo_user: apigee
apigee_repo_uri: software.apigee.com
apigee_repo_url: https://{{ apigee_repo_uri }}/bootstrap.sh
apigee_service: '{{ apigee_installation_home }}/apigee-service/bin/apigee-service'
apigee_setup: '{{ apigee_installation_home }}/apigee-setup/bin/setup.sh'
apigee_bootstrap: '{{ opdk_installer_path }}/bootstrap.sh'

apigee_setup_cmd: 'bash {{ apigee_service }} apigee-setup install'
apigee_validate_cmd: 'bash {{ apigee_service }} apigee-validate install'
apigee_adminapi_cmd: 'bash {{ apigee_service }} apigee-adminapi install'

apigee_repo: false
apigee_repo_host: 'ftp.apigee.com'
apigee_repo_archives_uri: 'API%20Services/Archive'
opdk_download_uri: 'https://{{ apigee_repo_user }}:{{ apigee_repo_password }}@{{ apigee_repo_host }}/{{ apigee_repo_archives_uri }}/{{ opdk_major_version }}.{{ opdk_minor_version }}/{{ opdk_installer_archive_filename }}'

opdk_pg_master: 'pgmaster'
opdk_pg_standby: 'pgstandby'
opdk_ldap_group: 'ldap'

provided_response_file: ''