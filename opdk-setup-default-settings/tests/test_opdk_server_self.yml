- hosts: '{{ hosts }}'
  roles:
    - opdk-setup-default-settings

  tasks:
  - name: Obtain server self report
    opdk_server_self:
      server_type: '{{ server_type }}'
      username: '{{ opdk_user_email }}'
      password: '{{ opdk_user_pass }}'
    register: server

  - debug: var=server
  - debug: var=server.ansible_facts

  - name: Can I echo as an object?
    echo:
      value: '{{ server.ansible_facts.edge_ms_self }}'
      echo: 'uUID'
    register: found


  - debug: var=found
