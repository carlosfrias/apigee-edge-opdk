---
# tasks file for opdk-setup-default-settings
- name: Get public address for node
  set_fact:
    public_address: '{{ inventory_hostname }}'

- name: Get private address for node
  set_fact:
    local_address: '{{ ansible_eth0.ipv4.address }}'

- name: Get public address for node on AWS
  set_fact:
    public_address: '{{ ansible_ec2_public_ipv4 }}'
  when: "{{ ansible_bios_version | search('amazon') and ansible_ec2_public_ipv4 is defined}}"

- name: Get private address for node on AWS
  set_fact:
    local_address: '{{ ansible_ec2_local_ipv4 }}'
  when: "{{ ansible_bios_version | search('amazon') and ansible_ec2_local_ipv4 is defined }}"

- include: network-interface-name.yml