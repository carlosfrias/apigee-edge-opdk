---
- name: Normal interface name for redhat family
  set_fact:
    interfaceName: 'ansible_eth0'
  when: ansible_os_family | lower == 'redhat'

- name: Capture interface Name if running Centos on Virtualbox
  set_fact:
    interfaceName: "ansible_eth1"
  when: ansible_bios_version | lower | search('virtualbox') and ansible_distribution | lower == 'centos'

- name: Capture Interface Name if running Centos
  set_fact:
    interfaceName: "ansible_eth0"
  when: not ansible_bios_version | search('VirtualBox') and ansible_distribution | lower == 'centos'

- name: Capture Interface Name if running Centos on Amazon
  set_fact:
    interfaceName: "ansible_eth0"
  when: ansible_bios_version | search('amazon') and ansible_distribution | lower == 'centos'

- name: Capture Interface Name if running Oracle Linux 7 on Virtualbox
  set_fact:
    interfaceName: "ansible_enp0s8"
  when: ansible_bios_version | search('VirtualBox') and ansible_distribution_major_version == '7' and ansible_distribution | lower == 'oraclelinux'

- name: Capture Interface Name if running Oracle Linux 7
  set_fact:
    interfaceName: "ansible_enp0s3"
  when: not ansible_bios_version | search('VirtualBox') and ansible_distribution_major_version == '7' and ansible_distribution | lower == 'oraclelinux'

- name: Capture Interface Name if running Oracle Linux 6 on Virtualbox
  set_fact:
    interfaceName: "ansible_eth1"
  when: ansible_bios_version | search('VirtualBox') and ansible_distribution_major_version == '6' and ansible_distribution | lower == 'oraclelinux'

- name: Capture Interface Name if running Oracle Linux 6
  set_fact:
    interfaceName: "ansible_eth0"
  when: not ansible_bios_version | search('VirtualBox') and ansible_distribution_major_version == '6' and ansible_distribution | lower == 'oraclelinux'
