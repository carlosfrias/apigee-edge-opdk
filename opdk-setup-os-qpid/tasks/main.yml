---
# tasks file for opdk-setup-os-qpid

- name: Update os version packages
  yum:
    name: '{{ item }}'
    state: latest
    update_cache: yes
  with_items:
    - libaio
    - libstdc++
    - cyrus-sasl-lib
    - nss-util
    - nss
    - nspr
    - boost-program-options
    - libuuid

- name: Update qpid os version 6 packages
  yum:
    name: "{{ item }}"
    state: latest
    update_cache: yes
  with_items:
    - db4-cxx
    - glibc
    - boost-filesystem
    - boost-system
    - boost-test
    - boost
    - boost-devel
  when: ansible_distribution_major_version == '6'


- name: Update qpid os version 7 packages
  yum:
    name: "{{ item }}"
    state: latest
    update_cache: yes
  with_items:
  - libgcc
  - nss-softokn-freebl
  - perl-libs
  - zlib
  when: ansible_distribution_major_version == '7'

- name: Update limits.conf
  copy:
    src: apigee.limits.conf
    dest: /etc/security/limits.d/apigee.limits.conf
    owner: root
    group: root
    mode: 0644
