---
# tasks file for opdk-setup-selinux-enable
- name: Permanently enable SELINUX
  lineinfile:
    dest: /etc/selinux/config
    regexp: "^(SELINUX=)"
    line: '\1enabled'
    backrefs: yes
    backup: yes

- name: Temporarily enable selinux on CentOS 7
  shell: setenforce 1
  when: ansible_distribution | lower == "centos" and ansible_distribution_major_version == "7"
