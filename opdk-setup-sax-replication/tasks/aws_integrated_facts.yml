---
- block:

  - name: Set slave public address
    set_fact:
      slave_public_address: "{{ hostvars[ansible_ec2_public_ipv4]['groups']['pgstandby'][0] }}"

  - name: Set slave private address
    set_fact:
      slave_local_address: "{{ hostvars[slave_public_address]['ansible_ec2_local_ipv4'] }}"

  - name: Set master public address
    set_fact:
      master_public_address: "{{ hostvars[ansible_ec2_public_ipv4]['groups']['pgmaster'][0] }}"

  - name: Set master private address
    set_fact:
      master_local_address: "{{ hostvars[master_public_address]['ansible_ec2_local_ipv4'] }}"


  when: "{{ ansible_bios_version | search('amazon') and ansible_ec2_public_ipv4 is defined and ansible_ec2_local_ipv4 is defined }}"
