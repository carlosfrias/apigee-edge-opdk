---
# defaults file for opdk-setup-local-repository-archive
opdk_installer_path: "{{ opdk_user_home }}/{{ opdk_staging_folder_name }}"
apigee_bootstrap_tmp_dir: '/tmp/bootstrap.sh'

apigee_repo_url: https://{{ apigee_repo_uri }}

apigee_4160100_bootstrap: bootstrap.sh
apigee_4160500_bootstrap: bootstrap_4.16.05.sh

apigee_4160100_repo_url: '{{ apigee_repo_url }}/{{ apigee_4160100_bootstrap }}'
apigee_4160500_repo_url: '{{ apigee_repo_url }}/{{ apigee_4160500_bootstrap }}'

archive_mirror_data_dir: '{{ apigee_installation_home }}/data/apigee-mirror'
archive_name: apigee-{{ opdk_version }}.tar.gz
archive_path: '{{ archive_mirror_data_dir }}/{{ archive_name }}'
