---
# tasks file for opdk-setup-logs
- name: Find installation log files to download
  shell: "find {{ item.dir }} -type f -name '{{ item.name }}'"
  register: logs
  with_items:
  - { dir: '/tmp', name: '*log' }
  - { dir: '{{ apigee_installation_home }}/var/log/', name: '*log' }
  - { dir: '{{ apigee_installation_home }}', name: '*out' }
  - { dir: '{{ opdk_installer_path }}', name: '*.txt' }
  ignore_errors: yes

- name: Pull results out of logs search
  set_fact:
    results: '{{ item }}'
  with_flattened:
  - '{{ logs.results }}'

- name: Pull lines out of results
  set_fact:
    lines: '{{ item }}'
  with_flattened:
  - '{{ results.stdout_lines }}'

- name: Download log files
  fetch:
    src: "{{ item }}"
    dest: '{{ conf_logs_dir }}'
  with_items:
  - "{{ lines }}"
  ignore_errors: yes
