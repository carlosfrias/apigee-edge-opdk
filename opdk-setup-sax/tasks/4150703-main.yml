---

- name: Check for ingest JMX port
  register: ingest_jmx_port_status
  ignore_errors: true
  wait_for:
    host: '{{ ansible_hostname }}'
    port: '{{ ingest_jmx_port }}'
    timeout: 1

#- name: Check for postgres JMX port
#  register: pgserver_jmx_port_status
#  ignore_errors: true
#  wait_for:
#    host: '{{ ansible_hostname }}'
#    port: '{{ pgserver_jmx_port }}'
#    timeout: 1

- name: Check for postgres DB port
  register: pg_db_port_status
  ignore_errors: true
  wait_for:
    host: '{{ ansible_hostname }}'
    port: '{{ pg_db_port }}'
    timeout: 1

- name: Check for qpid HTTP port
  register: qpid_self_port_status
  ignore_errors: true
  wait_for:
    host: '{{ ansible_hostname }}'
    port: '{{ qpid_self_port }}'
    timeout: 1

#- name: Check for postgres server HTTP port
#  register: pgserver_self_port_status
#  ignore_errors: true
#  wait_for:
#    host: '{{ ansible_hostname }}'
#    port: '{{ pgserver_self_port }}'
#    timeout: 1

- name: Setup Qpid and Postgres
  shell: "{{ apigee_setup }} -f {{ opdk_response_file_path }} -p sax"
  ignore_errors: yes
  when: ingest_jmx_port_status | failed or pg_db_port_status | failed or qpid_self_port_status | failed
#  when: ingest_jmx_port_status | failed or pg_db_port_status | failed or qpid_self_port_status | failed or pgserver_self_port_status | failed
#  when: ingest_jmx_port_status | failed or pgserver_jmx_port_status | failed or pg_db_port_status | failed or qpid_self_port_status | failed or pgserver_self_port_status | failed

- name: Confirm ingest JMX port
  ignore_errors: true
  wait_for:
    timeout: 1
    host: '{{ ansible_hostname }}'
    port: '{{ ingest_jmx_port }}'
  register: ingest_jmx_port_status

#- name: Confirm posgtgres JMX port
