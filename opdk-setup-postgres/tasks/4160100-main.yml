---
- name: Fix permissions on pgdata folder
  file:
    path: '{{ apigee_posgresql_data_dir }}'
    owner: '{{ opdk_user_name }}'
    group: '{{ opdk_group_name }}'
    mode: 0700
    state: directory

- name: Postgresql Server installation
  shell: '{{ apigee_setup_16 }} -p ps -f {{ opdk_response_file_path }}'
  register: pg_install_results
