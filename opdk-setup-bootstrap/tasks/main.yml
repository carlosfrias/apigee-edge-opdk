---
# tasks file for opdk-setup-bootstrap
- name: Download bootstrap
  bootstrap:
    dest_dir: '{{ opdk_installer_path }}'
    version: '{{ opdk_version }}'
    url: '{{ apigee_repo_url }}'
  register: results

- name: Fail the playbook if bootstrap fails to install
  fail:
    msg: 'Bootstrap installation failed, no point in letting this go further'
  when: results | failed

- name: Install bootstrap
  shell: '{{ bootstrap_script }} apigeeuser={{ apigee_repo_user }} apigeepassword="{{ apigee_repo_password }}" JAVA_FIX=C'
  register: results
  env:
    JAVA_HOME: '{{ java_home }}'
  failed_when: results.rc > 0 or results | failed
