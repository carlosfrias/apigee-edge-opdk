---
# tasks file for opdk-setup-validate

- include: network-interface-name.yml

- name: Create apigee-validate.conf file
  template:
    src: apigee-validate.conf.j2
    dest: '{{ apigee_validate_config_file }}'

- name: Validate OPDK Installation
  expect:
    command: '{{ apigee_validate_setup_cmd }} -f {{ apigee_validate_config_file }}'
    responses:
      '(?i)Press a key:': '\n'
  register: status

- name: Validate OPDK Installation REport
  debug:
    var: status
